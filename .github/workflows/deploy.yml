name: Deploy FLUFF Theme to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy Theme via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Ensure Server Target Directory Exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            mkdir -p /var/www/qamareen/wp-content/themes/fluff

      - name: Copy Theme Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          target: "/var/www/qamareen/wp-content/themes/fluff"
          overwrite: true
          strip_components: 0
